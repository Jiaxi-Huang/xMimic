[project]
name = "xmimic"
version = "0.1.0"
description = "Whole-body motion tracking with MotrixSim and RSL-RL."
requires-python = "==3.10.*"
dependencies = [
    "motrix-envs==0.3.0",
    "motrix-rl==0.3.0",
    "motrixsim==0.9.1.dev112911",
    "motrixsim-core==0.9.1.dev112911+pro",
    "rsl-rl-lib==5.4.2",
    "torch===2.7.0+cu128",
    "torchvision===0.22.0+cu128",
    "whole-body-tracking==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
# ROS Jazzy exposes Python 3.12 pytest plugins through the sourced shell
# environment.  This project runs on Python 3.10 and does not use those
# plugins, so prevent pytest from importing the incompatible ROS packages.
addopts = [
    "-p",
    "no:launch_testing",
    "-p",
    "no:launch_ros",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
motrix-envs = { path = "../morphos-lab/motrix_envs", editable = true }
motrix-rl = { path = "../morphos-lab/motrix_rl", editable = true }
motrixsim = { index = "motphys" }
motrixsim-core = { index = "motphys" }
rsl-rl-lib = { index = "pypi" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
whole-body-tracking = { path = "source/whole_body_tracking", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "motphys"
url = "http://pypi.mp/simple"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.isort]

atomic = true
profile = "black"
line_length = 120
py_version = 310
skip_glob = ["docs/*", "logs/*"]
group_by_package = true

sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "ISAACLABPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
extra_standard_library = [
    "numpy",
    "h5py",
    "open3d",
    "torch",
    "tensordict",
    "bpy",
    "matplotlib",
    "gymnasium",
    "gym",
    "scipy",
    "hid",
    "yaml",
    "prettytable",
    "toml",
    "trimesh",
    "tqdm",
    "psutil",
]
known_thirdparty = [
    "isaacsim.core.api",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
    "Semantics",
]
known_isaaclabparty = [
    "isaaclab",
    "isaaclab_tasks",
    "isaaclab_assets",
    "isaaclab_mimic",
    "isaaclab_rl"
]

# Modify the following to include the package names of your first-party code
known_firstparty = "whole_body_tracking"
known_local_folder = "config"

[tool.pyright]

exclude = [
    "**/__pycache__",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"
